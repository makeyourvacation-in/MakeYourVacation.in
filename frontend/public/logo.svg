<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D46B"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A57"/>
      <stop offset="1" stop-color="#071E3D"/>
    </linearGradient>
  </defs>
  <!-- rounded navy square -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- thin gold ring -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.9"/>
  <!-- mountain (left, dark navy silhouette on lighter navy) -->
  <path d="M20 92 L44 60 L60 78 L74 62 L88 76 L108 92 Z" fill="#0F3468"/>
  <!-- mountain highlight -->
  <path d="M44 60 L50 68 L46 74 Z" fill="#F7F7F7" opacity="0.85"/>
  <path d="M74 62 L80 70 L76 76 Z" fill="#F7F7F7" opacity="0.9"/>
  <!-- horizon gold line -->
  <path d="M20 92 L108 92" stroke="#D4AF37" stroke-width="1.6" fill="none" opacity="0.95"/>
  <!-- palm tree (right) -->
  <g transform="translate(90 60)" fill="#D4AF37">
    <path d="M0 32 C-1 22 -1 12 -1 2 L1 2 C1 12 1 22 0 32 Z"/>
    <path d="M-1 2 C-14 -4 -22 -1 -22 4 C-16 3 -8 4 -1 5 Z"/>
    <path d="M1 2 C14 -4 22 -1 22 4 C16 3 8 4 1 5 Z"/>
    <path d="M-1 2 C-8 -12 -14 -14 -18 -10 C-12 -8 -6 -3 -1 3 Z"/>
    <path d="M1 2 C8 -12 14 -14 18 -10 C12 -8 6 -3 1 3 Z"/>
    <path d="M0 2 C-2 -14 3 -20 8 -22 C4 -14 2 -8 0 3 Z"/>
  </g>
  <!-- airplane above with gold trail arc -->
  <path d="M18 44 Q64 20 110 44" stroke="#D4AF37" stroke-width="1.2" fill="none" stroke-dasharray="1.5 3.5" opacity="0.75"/>
  <g transform="translate(60 26) rotate(20)">
    <path d="M-14 0 L14 -2 L18 0 L14 2 L-14 0 Z M-8 -0.5 L-4 -6 L-2 -5.5 L-6 -0.5 Z M-8 0.5 L-4 6 L-2 5.5 L-6 0.5 Z M6 -0.5 L10 -3 L11 -2.5 L8 -0.5 Z" fill="#F7F7F7"/>
    <circle cx="14" cy="0" r="1.6" fill="#D4AF37"/>
  </g>
  <!-- MYV monogram -->
  <text x="64" y="112" font-family="Playfair Display, Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#D4AF37" letter-spacing="4">MYV</text>
</svg>
